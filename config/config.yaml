
artifacts_root: artifacts

# This would be the configuration for the data ingestion component of our ML pipeline. So this is basically Step 1 of our ML pipeline,
#which is data ingestion. So we have a root directory where all the artifacts related to data ingestion will be stored. 
#We have a source URL, which is the URL from where we will download the data. We have a local data file, 
#which is the path where we will save the downloaded data. And we have an unzip directory, which is the path where 
#we will unzip the downloaded data if it is in a compressed format.


data_ingestion:
  root_dir: artifacts/data_ingestion
  source_URL: https://raw.githubusercontent.com/ageron/handson-ml2/master/datasets/housing/housing.tgz
  local_data_file: artifacts/data_ingestion/housing.tgz
  unzip_dir: artifacts/data_ingestion

# Here we have the path to the schema file, which is the file that contains the schema of our data. 
# This is important because we will use this schema to validate our data during the data validation step of our ML pipeline.

data_validation:
  root_dir: artifacts/data_validation
  unzipped_data_dir: artifacts/data_ingestion/housing.csv
  status_file: artifacts/data_validation/status.txt


data_transformation:
  root_dir: artifacts/data_transformation
  data_path: artifacts/data_ingestion/housing.csv
  transformed_train_data: artifacts/data_transformation/transformed_train_data.csv
  transformed_test_data: artifacts/data_transformation/transformed_test_data.csv



model_trainer:
  root_dir: artifacts/model_trainer
  train_data_path: artifacts/data_transformation/transformed_train_data.csv
  test_data_path: artifacts/data_transformation/transformed_test_data.csv
  model_path: artifacts/model_trainer/model.joblib # helps save model in the harddrive and then we can use it later 